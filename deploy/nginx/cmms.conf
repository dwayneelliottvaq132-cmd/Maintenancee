# /etc/nginx/sites-available/cmms  (install.sh links it into sites-enabled)
# For HTTPS run:  sudo apt install certbot python3-certbot-nginx && sudo certbot --nginx -d your.domain
server {
    listen 80;
    # listen [::]:80;   # uncomment if the server has IPv6
    server_name _;

    root /opt/cmms/frontend;
    index index.html;
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # nginx drops server-level add_header lines in any location that has its own add_header,
    # so the security headers are repeated here
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy same-origin always;
    }

    # single-page app: let React Router handle unknown paths
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy same-origin always;
    }
}
