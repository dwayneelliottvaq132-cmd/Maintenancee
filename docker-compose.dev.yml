# Local development database only (production uses the Ubuntu PostgreSQL package).
#   docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16.4
    environment:
      POSTGRES_USER: cmms
      POSTGRES_PASSWORD: cmms
      POSTGRES_DB: cmms
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
volumes:
  pgdata:
